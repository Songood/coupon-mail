<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; min-height: 100vh; }

  .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 32px; display: flex; align-items: center; height: 56px; gap: 24px; }
  .header-logo { font-size: 16px; font-weight: 700; color: #0984e3; }
  .header-tabs { display: flex; gap: 4px; margin-left: auto; }
  .header-tab { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #636e72; cursor: pointer; border: none; background: none; }
  .header-tab.active { background: #f0f8ff; color: #0984e3; }

  .layout { display: grid; grid-template-columns: 280px 1fr 380px; gap: 20px; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card-title { font-size: 13px; font-weight: 700; color: #2d3436; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }

  .merchant-list { display: flex; flex-direction: column; gap: 6px; }
  .merchant-item { padding: 10px 12px; border-radius: 8px; border: 1.5px solid #f0f0f0; cursor: pointer; transition: 0.15s; }
  .merchant-item:hover { border-color: #0984e3; background: #f8fbff; }
  .merchant-item.selected { border-color: #0984e3; background: #f0f8ff; }
  .merchant-item-top { display: flex; align-items: center; gap: 8px; }
  .merchant-name { font-weight: 700; font-size: 13px; color: #2d3436; flex: 1; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .badge-후취 { background: #ffeaa7; color: #d4a017; }
  .badge-후취_VAT { background: #fab1a0; color: #c0392b; }
  .badge-선취 { background: #a8d8ea; color: #0984e3; }
  .badge-선취_MMS { background: #b8e994; color: #27ae60; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-done { background: #00b894; }
  .dot-draft { background: #fdcb6e; }
  .dot-none { background: #dfe6e9; }

  label { display: block; font-size: 11px; color: #636e72; margin-bottom: 4px; font-weight: 600; }
  input, select { width: 100%; padding: 8px 10px; border: 1.5px solid #e8e8e8; border-radius: 7px; font-size: 13px; font-family: 'Malgun Gothic', sans-serif; outline: none; transition: border 0.2s; }
  input:focus, select:focus { border-color: #0984e3; }
  input[readonly] { background: #f8f9fa; color: #636e72; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .full { margin-bottom: 10px; }
  .calc-hint { font-size: 10px; color: #0984e3; margin-top: 3px; }
  .divider { border: none; border-top: 1px dashed #e8e8e8; margin: 12px 0; }
  .section-label { font-size: 11px; font-weight: 700; color: #0984e3; margin-bottom: 8px; }

  button { padding: 9px 16px; border: none; border-radius: 8px; font-size: 13px; font-family: 'Malgun Gothic', sans-serif; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .btn-primary { background: #0984e3; color: white; }
  .btn-primary:hover { background: #0773c5; }
  .btn-send { background: #0984e3; color: white; width: 100%; padding: 12px; font-size: 14px; border-radius: 10px; margin-top: 6px; }
  .btn-send:hover { background: #0773c5; }
  .btn-draft { background: #fdcb6e; color: #2d3436; width: 100%; padding: 12px; font-size: 14px; border-radius: 10px; margin-top: 6px; }
  .btn-draft:hover { background: #f0b740; }
  .btn-red { background: #ff7675; color: white; padding: 5px 10px; font-size: 11px; }
  .btn-gray { background: #f0f0f0; color: #636e72; padding: 5px 10px; font-size: 11px; }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

  .result-section { display: flex; flex-direction: column; gap: 10px; }
  .result-box { border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; }
  .result-header { background: #f8f9fa; padding: 8px 12px; font-size: 11px; font-weight: 700; color: #636e72; display: flex; align-items: center; justify-content: space-between; }
  .result-body { padding: 10px 12px; font-size: 12px; color: #2d3436; line-height: 1.6; max-height: 300px; overflow-y: auto; }
  .btn-copy { background: #0984e3; color: white; padding: 3px 10px; font-size: 11px; border-radius: 5px; }

  .send-status { text-align: center; font-size: 12px; margin-top: 6px; color: #636e72; min-height: 20px; }

  .history-layout { padding: 24px 32px; max-width: 1000px; margin: 0 auto; }
  .month-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .history-table th { background: #f8f9fa; padding: 10px 14px; text-align: left; font-weight: 700; color: #636e72; border-bottom: 2px solid #e0e0e0; }
  .history-table td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  .history-table tr:hover td { background: #f8fbff; }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .status-sent { background: #d4f8e8; color: #00b894; }
  .status-draft { background: #ffeeba; color: #856404; }

  .manage-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; padding: 24px 32px; max-width: 1200px; margin: 0 auto; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2d3436; color: white; padding: 10px 22px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }

  .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1000; display:flex; align-items:center; justify-content:center; }
  .modal { background:white; border-radius:14px; padding:24px; width:280px; text-align:center; }
  .modal p { font-size:14px; color:#2d3436; margin-bottom:20px; line-height:1.6; }
  .modal-btns { display:flex; gap:10px; }
  .modal-btns button { flex:1; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .checkbox-row input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }
  .checkbox-row label { margin: 0; font-size: 12px; color: #2d3436; cursor: pointer; }

  .empty { text-align: center; color: #b2bec3; padding: 30px; font-size: 13px; }
  .to-info { font-size: 11px; color: #636e72; background: #f8f9fa; padding: 7px 10px; border-radius: 6px; margin-bottom: 10px; line-height: 1.8; }
  .attach-warn { background: #fff3cd; border: 1px solid #ffc107; border-radius: 7px; padding: 8px 12px; font-size: 12px; color: #856404; font-weight: 600; margin-bottom: 10px; }

  #mail-content table { border-collapse: collapse; margin: 8px 0; }
  #mail-content td { border: 1px solid #b2bec3; padding: 6px 14px; font-size: 13px; }
  #mail-content td:first-child { background: #f0f4f8; font-weight: 600; width: 90px; text-align: center; }
  #mail-content td:last-child { text-align: right; min-width: 140px; }

  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">🧾 쿠칩 정산 메일</div>
  <div class="header-tabs">
    <button class="header-tab active" onclick="showPage('write', this)">✍️ 메일 작성</button>
    <button class="header-tab" onclick="showPage('history', this)">📋 발송 이력</button>
    <button class="header-tab" onclick="showPage('manage', this)">🏪 가맹점 관리</button>
    <button class="header-tab" onclick="showPage('settings', this)">⚙️ 설정</button>
  </div>
</div>

<!-- 메일 작성 -->
<div class="page active" id="page-write">
  <div class="layout">
    <div>
      <div class="card">
        <div class="card-title">가맹점 선택</div>
        <div class="row2" style="margin-bottom:12px;">
          <div>
            <label>정산 년도</label>
            <input type="number" id="year" value="2026" onchange="generate()">
          </div>
          <div>
            <label>정산 월</label>
            <select id="month" onchange="generate()">
              <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
              <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
              <option value="7" selected>7월</option><option value="8">8월</option><option value="9">9월</option>
              <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
            </select>
          </div>
        </div>
        <div id="merchant-select-list" class="merchant-list"></div>
        <div id="no-merchant" class="empty" style="display:none;">가맹점 관리에서 먼저 추가해주세요!</div>
      </div>
    </div>

    <div id="input-area" style="display:none;">
      <div class="card">
        <div class="card-title" id="input-title">금액 입력</div>
        <div class="to-info" id="to-info"></div>
        <div id="attach-warn" class="attach-warn" style="display:none;">📎 첨부파일이 필요한 가맹점입니다!</div>

        <div id="section-common">
          <div class="row2">
            <div><label>거래금액 (원)</label><input type="text" id="trade" placeholder="예) 30,387,650" oninput="fmtInput('trade')"></div>
            <div><label>할인금액 (원)</label><input type="text" id="discount" placeholder="예) 1,241,608" oninput="fmtInput('discount')"></div>
          </div>
          <div id="row-vat" style="display:none;" class="full">
            <label>VAT (할인금액×10% 자동)</label>
            <input type="text" id="vat" readonly placeholder="자동 계산">
          </div>
          <div class="full">
            <label>청구금액 (자동 계산)</label>
            <input type="text" id="charge" readonly placeholder="자동 계산">
            <div class="calc-hint" id="charge-hint"></div>
          </div>
        </div>

        <div id="mms-section" style="display:none;">
          <hr class="divider">
          <div class="section-label">MMS 이용내역</div>
          <div class="row2">
            <div><label>이용건수</label><input type="text" id="mms-count" placeholder="예) 284" oninput="generate()"></div>
            <div><label>건당 고정금액</label><input type="text" id="mms-unit" readonly></div>
          </div>
          <div class="row2">
            <div><label>공급가액</label><input type="text" id="mms-supply" readonly></div>
            <div><label>VAT (×10%)</label><input type="text" id="mms-vat" readonly></div>
          </div>
          <div class="full"><label>합계</label><input type="text" id="mms-total" readonly></div>
          <hr class="divider">
          <div class="section-label">쿠칩 거래내역</div>
          <div class="row2">
            <div><label>거래금액</label><input type="text" id="mms-trade" placeholder="예) 25,706,600" oninput="fmtInput('mms-trade')"></div>
            <div><label>할인금액</label><input type="text" id="mms-discount" placeholder="예) 3,097,556" oninput="fmtInput('mms-discount')"></div>
          </div>
          <div class="full">
            <label>청구금액 (자동)</label>
            <input type="text" id="mms-charge" readonly>
            <div class="calc-hint" id="mms-charge-hint"></div>
          </div>
        </div>

        <div id="action-btns"></div>
        <div class="send-status" id="send-status"></div>
      </div>
    </div>

    <div id="preview-area" style="display:none;">
      <div class="card result-section">
        <div class="card-title">미리보기</div>
        <div class="result-box">
          <div class="result-header">📧 제목 <button class="btn-copy" onclick="copyText('mail-subject')">복사</button></div>
          <div class="result-body" id="mail-subject"></div>
        </div>
        <div class="result-box">
          <div class="result-header">📋 받는사람 <button class="btn-copy" onclick="copyText('mail-to')">복사</button></div>
          <div class="result-body" id="mail-to"></div>
        </div>
        <div id="mail-cc-box" class="result-box" style="display:none;">
          <div class="result-header">📋 참조 <button class="btn-copy" onclick="copyText('mail-cc')">복사</button></div>
          <div class="result-body" id="mail-cc"></div>
        </div>
        <div class="result-box">
          <div class="result-header">📝 본문 <button class="btn-copy" onclick="copyEl('mail-content')">복사</button></div>
          <div class="result-body"><div id="mail-content"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 발송 이력 -->
<div class="page" id="page-history">
  <div class="history-layout">
    <div class="card">
      <div class="month-selector">
        <div class="card-title" style="margin:0;border:none;padding:0;">📋 발송 이력</div>
        <input type="number" id="history-year" value="2026" onchange="renderHistory()" style="width:80px;">
        <select id="history-month" onchange="renderHistory()" style="width:70px;">
          <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
          <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
          <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
          <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
        </select>
      </div>
      <table class="history-table">
        <thead>
          <tr>
            <th>가맹점명</th><th>유형</th><th>발송 상태</th><th>청구금액</th><th>일시</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 가맹점 관리 -->
<div class="page" id="page-manage">
  <div class="manage-layout">
    <div class="card">
      <div class="card-title">가맹점 추가</div>
      <div class="full"><label>가맹점명</label><input type="text" id="new-name" placeholder="예) 당근페이(B2C)"></div>
      <div class="full">
        <label>유형</label>
        <select id="new-type" onchange="onTypeChange()">
          <option value="후취">후취</option>
          <option value="후취_VAT">후취 (VAT)</option>
          <option value="선취">선취</option>
          <option value="선취_MMS">선취 MMS</option>
        </select>
      </div>
      <div class="full">
        <label>발신자 이메일</label>
        <input type="text" id="new-sender" placeholder="기본 발신자 이메일">
      </div>
      <div class="full"><label>받는 사람 (TO)</label><input type="text" id="new-to" placeholder="예) abc@example.com"></div>
      <div class="full"><label>참조 (CC) — 없으면 빈칸</label><input type="text" id="new-cc" placeholder="예) couchip@hecto.co.kr"></div>
      <div class="full" id="new-unit-row" style="display:none;">
        <label>MMS 건당 고정금액 (원)</label>
        <input type="text" id="new-unit" placeholder="예) 60">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="new-attach">
        <label for="new-attach">첨부파일 필요한 가맹점</label>
      </div>
      <button class="btn-primary" style="width:100%;" onclick="addMerchant()">+ 가맹점 추가</button>
    </div>
    <div class="card">
      <div class="card-title">등록된 가맹점</div>
      <div id="merchant-manage-list" class="merchant-list"><div class="empty">아직 등록된 가맹점이 없어요.</div></div>
    </div>
  </div>
</div>

<!-- 설정 -->
<div class="page" id="page-settings">
  <div style="padding:24px 32px; max-width:500px; margin:0 auto;">
    <div class="card">
      <div class="card-title">⚙️ 기본 발신자 설정</div>
      <div class="full">
        <label>기본 발신자 이메일</label>
        <input type="text" id="default-sender" placeholder="예) couchip@hecto.co.kr">
        <div style="font-size:11px; color:#636e72; margin-top:4px;">네이버 웍스에 등록된 메일 주소만 유효해요</div>
      </div>
      <button class="btn-primary" style="width:100%;" onclick="saveSettings()">💾 저장</button>
    </div>
  </div>
</div>

<div id="modal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="btn-gray" onclick="closeModal()">취소</button>
      <button class="btn-red" style="padding:9px 16px;" onclick="confirmModal()">삭제</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var merchants = JSON.parse(localStorage.getItem('merchants') || '[]');
var historyData = JSON.parse(localStorage.getItem('mail_history') || '{}');
var settings = JSON.parse(localStorage.getItem('settings') || '{"defaultSender":""}');
var selectedIdx = -1;

function saveSettings() {
  settings.defaultSender = document.getElementById('default-sender').value.trim();
  localStorage.setItem('settings', JSON.stringify(settings));
  showToast('✅ 설정 저장 완료!');
}

function loadSettings() {
  if (settings.defaultSender) {
    document.getElementById('default-sender').value = settings.defaultSender;
  }
}

var PW = '<span style="background:#2d3436;color:#2d3436;border-radius:3px;padding:0 4px;">hecto12!@</span>';
var TDR = 'style="border:1px solid #b2bec3;padding:7px 16px;text-align:right;min-width:160px;"';
var TBL = 'style="border-collapse:collapse;margin:10px 0;"';

function mkTable(rows) {
  var html = '<table ' + TBL + '>';
  for (var i = 0; i < rows.length; i++) {
    html += '<tr><td ' + TDL + '>' + rows[i][0] + '</td><td ' + TDR + '>' + rows[i][1] + '</td></tr>';
  }
  return html + '</table>';
}

function showPage(page, el) {
  document.querySelectorAll('.header-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'write') renderSelectList();
  if (page === 'manage') renderManageList();
  if (page === 'history') renderHistory();
  if (page === 'settings') loadSettings();
}

function onTypeChange() {
  var t = document.getElementById('new-type').value;
  document.getElementById('new-unit-row').style.display = t === '선취_MMS' ? 'block' : 'none';
}

function saveMerchants() { localStorage.setItem('merchants', JSON.stringify(merchants)); }
function saveHistory() { localStorage.setItem('mail_history', JSON.stringify(historyData)); }

function typeLabel(t) {
  var map = {'후취':'후취','후취_VAT':'후취 VAT','선취':'선취','선취_MMS':'선취 MMS'};
  return map[t] || t;
}

function addMerchant() {
  var name = document.getElementById('new-name').value.trim();
  var type = document.getElementById('new-type').value;
  var to   = document.getElementById('new-to').value.trim();
  var cc   = document.getElementById('new-cc').value.trim();
  var attach = document.getElementById('new-attach').checked;
  var unit = parseInt((document.getElementById('new-unit').value || '').replace(/[^0-9]/g,'')) || 0;
  var sender = document.getElementById('new-sender').value.trim() || settings.defaultSender;
  if (!name) { showToast('가맹점명을 입력해주세요!'); return; }
  if (!to)   { showToast('이메일을 입력해주세요!'); return; }
  if (type === '선취_MMS' && !unit) { showToast('건당 고정금액을 입력해주세요!'); return; }
  merchants.push({name:name, type:type, to:to, cc:cc, attach:attach, unit:unit, sender:sender});
  saveMerchants();
  document.getElementById('new-name').value = '';
  document.getElementById('new-to').value = '';
  document.getElementById('new-cc').value = '';
  document.getElementById('new-sender').value = '';
  document.getElementById('new-unit').value = '';
  document.getElementById('new-attach').checked = false;
  renderManageList();
  showToast('✅ 가맹점 추가 완료!');
}

var deleteTargetIdx = -1;
function deleteMerchant(idx) {
  deleteTargetIdx = idx;
  document.getElementById('modal-msg').textContent = '"' + merchants[idx].name + '" 삭제할까요?';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; deleteTargetIdx = -1; }
function confirmModal() {
  if (deleteTargetIdx < 0) return;
  merchants.splice(deleteTargetIdx, 1);
  saveMerchants();
  if (selectedIdx === deleteTargetIdx) selectedIdx = -1;
  closeModal();
  renderManageList();
  renderSelectList();
  showToast('🗑️ 삭제됐어요.');
}

function toggleEdit(idx) {
  var el = document.getElementById('edit-' + idx);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function saveEdit(idx) {
  merchants[idx].name   = document.getElementById('edit-name-' + idx).value.trim();
  merchants[idx].type   = document.getElementById('edit-type-' + idx).value;
  merchants[idx].to     = document.getElementById('edit-to-' + idx).value.trim();
  merchants[idx].cc     = document.getElementById('edit-cc-' + idx).value.trim();
  merchants[idx].attach = document.getElementById('edit-attach-' + idx).checked;
  merchants[idx].unit   = parseInt((document.getElementById('edit-unit-' + idx) ? document.getElementById('edit-unit-' + idx).value : '0').replace(/[^0-9]/g,'')) || 0;
  saveMerchants();
  renderManageList();
  renderSelectList();
  showToast('✅ 수정 완료!');
}

function getMonthKey() {
  var y = document.getElementById('year') ? document.getElementById('year').value : new Date().getFullYear();
  var m = document.getElementById('month') ? document.getElementById('month').value : (new Date().getMonth() + 1);
  return y + '-' + String(m).padStart(2, '0');
}

function getMerchantStatus(name) {
  var key = getMonthKey();
  return (historyData[key] && historyData[key][name]) ? historyData[key][name] : null;
}

function renderSelectList() {
  var el = document.getElementById('merchant-select-list');
  var noEl = document.getElementById('no-merchant');
  if (!merchants.length) {
    el.innerHTML = ''; noEl.style.display = 'block';
    document.getElementById('input-area').style.display = 'none';
    document.getElementById('preview-area').style.display = 'none';
    return;
  }
  noEl.style.display = 'none';
  var html = '';
  for (var i = 0; i < merchants.length; i++) {
    var m = merchants[i];
    var st = getMerchantStatus(m.name);
    var dotClass = st && st.status === 'sent' ? 'dot-done' : (st && st.status === 'draft' ? 'dot-draft' : 'dot-none');
    html += '<div class="merchant-item ' + (selectedIdx === i ? 'selected' : '') + '" onclick="selectMerchant(' + i + ')">';
    html += '<div class="merchant-item-top">';
    html += '<div class="status-dot ' + dotClass + '"></div>';
    html += '<div class="merchant-name">' + m.name + '</div>';
    html += '<span class="badge badge-' + m.type + '">' + typeLabel(m.type) + '</span>';
    if (m.attach) html += '<span style="font-size:10px;color:#e17055;">📎</span>';
    html += '</div></div>';
  }
  el.innerHTML = html;
}

function renderManageList() {
  // 발신자 placeholder 기본값 반영
  var senderInput = document.getElementById('new-sender');
  if (senderInput) senderInput.placeholder = settings.defaultSender || '기본 발신자 이메일';
  var el = document.getElementById('merchant-manage-list');
  if (!merchants.length) { el.innerHTML = '<div class="empty">아직 등록된 가맹점이 없어요.</div>'; return; }
  var html = '';
  for (var i = 0; i < merchants.length; i++) {
    var m = merchants[i];
    html += '<div class="merchant-item" style="cursor:default;flex-direction:column;align-items:flex-start;gap:6px;">';
    html += '<div style="display:flex;width:100%;align-items:center;gap:6px;">';
    html += '<div class="merchant-name">' + m.name + '</div>';
    html += '<span class="badge badge-' + m.type + '">' + typeLabel(m.type) + '</span>';
    if (m.attach) html += '<span style="font-size:10px;color:#e17055;">📎</span>';
    html += '<button class="btn-gray btn-sm" style="margin-left:auto;" onclick="toggleEdit(' + i + ')">수정</button>';
    html += '<button class="btn-red btn-sm" onclick="deleteMerchant(' + i + ')">삭제</button>';
    html += '</div>';
    html += '<div id="edit-' + i + '" style="display:none;width:100%;border-top:1px dashed #e8e8e8;padding-top:10px;">';
    html += '<div class="full"><label>가맹점명</label><input type="text" id="edit-name-' + i + '" value="' + m.name + '"></div>';
    html += '<div class="full"><label>유형</label><select id="edit-type-' + i + '">';
    html += '<option value="후취"' + (m.type==='후취'?' selected':'') + '>후취</option>';
    html += '<option value="후취_VAT"' + (m.type==='후취_VAT'?' selected':'') + '>후취 (VAT)</option>';
    html += '<option value="선취"' + (m.type==='선취'?' selected':'') + '>선취</option>';
    html += '<option value="선취_MMS"' + (m.type==='선취_MMS'?' selected':'') + '>선취 MMS</option>';
    html += '</select></div>';
    html += '<div class="full"><label>받는 사람 (TO)</label><input type="text" id="edit-to-' + i + '" value="' + m.to + '"></div>';
    html += '<div class="full"><label>참조 (CC)</label><input type="text" id="edit-cc-' + i + '" value="' + (m.cc||'') + '"></div>';
    if (m.type === '선취_MMS') {
      html += '<div class="full"><label>건당 고정금액</label><input type="text" id="edit-unit-' + i + '" value="' + (m.unit||'') + '"></div>';
    } else {
      html += '<input type="hidden" id="edit-unit-' + i + '" value="0">';
    }
    html += '<div class="checkbox-row" style="margin-bottom:10px;">';
    html += '<input type="checkbox" id="edit-attach-' + i + '"' + (m.attach?' checked':'') + '>';
    html += '<label for="edit-attach-' + i + '">첨부파일 필요</label></div>';
    html += '<button class="btn-primary" style="width:100%;" onclick="saveEdit(' + i + ')">💾 저장</button>';
    html += '</div></div>';
  }
  el.innerHTML = html;
}

function renderHistory() {
  var y = document.getElementById('history-year').value;
  var m = document.getElementById('history-month').value;
  var key = y + '-' + String(m).padStart(2, '0');
  var data = historyData[key] || {};
  var tbody = document.getElementById('history-body');
  var keys = Object.keys(data);
  if (!keys.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#b2bec3;padding:30px;">이 달의 발송 이력이 없어요.</td></tr>';
    return;
  }
  var html = '';
  for (var i = 0; i < keys.length; i++) {
    var name = keys[i];
    var info = data[name];
    var badge = info.status === 'sent'
      ? '<span class="status-badge status-sent">✅ 발송완료</span>'
      : '<span class="status-badge status-draft">⏳ 임시저장</span>';
    html += '<tr><td><b>' + name + '</b></td><td><span class="badge badge-' + info.type + '">' + typeLabel(info.type) + '</span></td><td>' + badge + '</td><td>' + (info.charge||'-') + '</td><td style="color:#636e72;font-size:12px;">' + (info.datetime||'-') + '</td></tr>';
  }
  tbody.innerHTML = html;
}

function selectMerchant(idx) {
  selectedIdx = idx;
  var m = merchants[idx];
  renderSelectList();
  document.getElementById('to-info').innerHTML = 
    '<b>발신자:</b> ' + (m.sender || settings.defaultSender || '기본 계정') + 
    '<br><b>TO:</b> ' + m.to + 
    (m.cc ? '<br><b>CC:</b> ' + m.cc : '');
  document.getElementById('attach-warn').style.display = m.attach ? 'block' : 'none';
  document.getElementById('row-vat').style.display = m.type === '후취_VAT' ? 'block' : 'none';
  document.getElementById('section-common').style.display = m.type === '선취_MMS' ? 'none' : 'block';
  document.getElementById('mms-section').style.display = m.type === '선취_MMS' ? 'block' : 'none';
  if (m.type === '선취_MMS') document.getElementById('mms-unit').value = m.unit ? m.unit.toLocaleString('ko-KR') + ' 원' : '-';
  document.getElementById('input-title').textContent = m.name + ' 금액 입력';
  document.getElementById('input-area').style.display = 'block';
  document.getElementById('preview-area').style.display = 'block';
  var ids = ['trade','discount','vat','charge','mms-count','mms-supply','mms-vat','mms-total','mms-trade','mms-discount','mms-charge'];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.value = '';
  }
  document.getElementById('action-btns').innerHTML =
    '<button class="btn-send" onclick="doSend(\'sent\')">🚀 메일 발송</button>' +
    '<button class="btn-draft" onclick="doSend(\'draft\')">💾 임시저장</button>';
  generate();
}

function isHoliday(d) {
  var mmdd = String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  return ['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'].indexOf(mmdd) >= 0;
}
function prevWorkday(d) {
  var t = new Date(d); t.setDate(t.getDate()-1);
  while (t.getDay()===0||t.getDay()===6||isHoliday(t)) t.setDate(t.getDate()-1);
  return t;
}
function getTaxDL(year, month) {
  var d = new Date(year, month-1, 10);
  while (d.getDay()===0||d.getDay()===6||isHoliday(d)) d = prevWorkday(d);
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}
function getPeriod(y, m) {
  var mm = String(m).padStart(2,'0');
  var last = new Date(y, m, 0).getDate();
  return String(y).slice(2) + '.' + mm + '.01~' + String(y).slice(2) + '.' + mm + '.' + last;
}
function toInt(id) {
  var v = document.getElementById(id) ? document.getElementById(id).value : '';
  return parseInt(v.replace(/[^0-9]/g,'')) || 0;
}
function fmt(n) { return (!n && n !== 0) ? '-' : n.toLocaleString('ko-KR') + ' 원'; }
function fmtHL(n) {
  if (!n && n !== 0) return '-';
  return '<span style="background:#fff200;font-weight:700;"><b>' + n.toLocaleString('ko-KR') + ' 원</b></span>';
}
function fmtInput(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var raw = el.value.replace(/[^0-9]/g, '');
  if (raw) el.value = parseInt(raw).toLocaleString('ko-KR');
  generate();
}

function generate() {
  if (selectedIdx < 0) return;
  var m = merchants[selectedIdx];
  var y = parseInt(document.getElementById('year').value);
  var mo = parseInt(document.getElementById('month').value);
  var curMo = mo + 1, curY = y;
  if (curMo > 12) { curMo = 1; curY++; }
  var period = getPeriod(y, mo);
  var taxDL = getTaxDL(curY, curMo);
  var payDL = curMo + '월 20일';
  var chargeVal = 0, html = '';

  if (m.type === '선취_MMS') {
    var count = toInt('mms-count'), unit = m.unit || 0;
    var supply = count * unit, mmsVat = Math.round(supply * 0.1), total = supply + mmsVat;
    var trade = toInt('mms-trade'), disc = toInt('mms-discount');
    chargeVal = trade - disc;
    document.getElementById('mms-supply').value = supply ? supply.toLocaleString('ko-KR') + ' 원' : '';
    document.getElementById('mms-vat').value = mmsVat ? mmsVat.toLocaleString('ko-KR') + ' 원' : '';
    document.getElementById('mms-total').value = total ? total.toLocaleString('ko-KR') + ' 원' : '';
    document.getElementById('mms-charge').value = chargeVal ? chargeVal.toLocaleString('ko-KR') + ' 원' : '';
    document.getElementById('mms-charge-hint').textContent = (trade && disc) ? trade.toLocaleString('ko-KR') + ' - ' + disc.toLocaleString('ko-KR') + ' = ' + chargeVal.toLocaleString('ko-KR') : '';
    var countDisp = count ? count + '건' : '-';
    html += '안녕하세요.<br>헥토파이낸셜 쿠칩 담당자입니다.<br><br>';
    html += mo + '월 쿠칩 이용 금액을 공유 드리오니, 상세 내역은 쿠칩 가맹점 관리자 내에서 확인 부탁드립니다.<br><br>';
    html += '<b>&lt;MMS 이용내역&gt;</b><br>';
    html += mkTable([['정산기간',period],['이용건수',countDisp],['공급가액',fmt(supply)],['VAT',fmt(mmsVat)],['합계',fmt(total)]]);
    html += '-. 입금계좌 : 농협은행 369-01-015296 주식회사 헥토파이낸셜<br><br>';
    html += mkTable([['정산기간',period],['거래금액',fmt(trade)],['할인금액',fmt(disc)],['청구금액',fmtHL(chargeVal)]]);
  } else {
    var trade2 = toInt('trade'), disc2 = toInt('discount');
    var vat = m.type === '후취_VAT' ? Math.round(disc2 * 0.1) : toInt('vat');
    if (m.type === '후취_VAT') {
      document.getElementById('vat').value = vat ? vat.toLocaleString('ko-KR') + ' 원' : '';
      chargeVal = trade2 - disc2 - vat;
    } else { chargeVal = trade2 - disc2; }
    document.getElementById('charge').value = chargeVal ? chargeVal.toLocaleString('ko-KR') + ' 원' : '';
    if (m.type === '후취_VAT') {
      document.getElementById('charge-hint').textContent = (trade2 && disc2) ? trade2.toLocaleString('ko-KR') + ' - ' + disc2.toLocaleString('ko-KR') + ' - ' + vat.toLocaleString('ko-KR') + ' = ' + chargeVal.toLocaleString('ko-KR') : '';
    } else {
      document.getElementById('charge-hint').textContent = (trade2 && disc2) ? trade2.toLocaleString('ko-KR') + ' - ' + disc2.toLocaleString('ko-KR') + ' = ' + chargeVal.toLocaleString('ko-KR') : '';
    }
    html += '안녕하세요.<br>헥토파이낸셜 쿠칩 담당자입니다.<br><br>';
    if (m.type === '후취_VAT') {
      html += mo + '월 거래 상세 데이터, 인보이스 전달 드리오니,<br>';
      html += taxDL + '까지 세금계산서 발행 및 ' + payDL + '까지 입금 요청 드립니다.<br>';
      html += '(첨부파일 비밀번호 : ' + PW + ')<br><br>';
      html += '-. 입금 계좌 : 우리은행 1005-503-092226 (주)헥토파이낸셜<br><br>';
      html += mkTable([['정산기간',period],['거래금액',fmt(trade2)],['할인금액',fmt(disc2)],['VAT',fmt(vat)],['청구금액',fmtHL(chargeVal)]]);
    } else if (m.type === '선취') {
      html += mo + '월 이용 금액을 거래 상세 데이터 파일에서 확인 부탁드립니다. (파일 PW : hecto12!@)<br><br>';
      html += mkTable([['정산기간',period],['거래금액',fmt(trade2)],['할인금액',fmt(disc2)],['청구금액',fmtHL(chargeVal)]]);
    } else {
      html += '유첨파일 통해 ' + m.name + ' 데이터 전달 드립니다.<br>';
      html += '(첨부파일 비밀번호 : ' + PW + ')<br>';
      html += '특이사항 없을 경우, ' + payDL + '까지 정산 금액 입금 부탁 드립니다.<br><br>';
      html += mkTable([['정산기간',period],['거래금액',fmt(trade2)],['할인금액',fmt(disc2)],['청구금액',fmtHL(chargeVal)]]);
      html += '<br>-. 입금 계좌 : 우리은행 1005-503-092226 (주)헥토파이낸셜';
    }
  }
  html += '<br><br>감사합니다.';
  document.getElementById('mail-subject').textContent = '[쿠칩] ' + mo + '월 정산 내역 전달의 건_' + m.name;
  document.getElementById('mail-to').textContent = m.to;
  var ccBox = document.getElementById('mail-cc-box');
  if (m.cc) { document.getElementById('mail-cc').textContent = m.cc; ccBox.style.display = 'block'; }
  else ccBox.style.display = 'none';
  document.getElementById('mail-content').innerHTML = html;
}

function recordHistory(name, status, chargeText) {
  var key = getMonthKey();
  if (!historyData[key]) historyData[key] = {};
  var m = merchants[selectedIdx];
  historyData[key][name] = {
    status: status, type: m.type,
    charge: chargeText,
    datetime: new Date().toLocaleString('ko-KR')
  };
  saveHistory();
  renderSelectList();
}

async function doSend(status) {
  if (selectedIdx < 0) { showToast('가맹점을 먼저 선택해주세요!'); return; }
  var m = merchants[selectedIdx];
  var statusEl = document.getElementById('send-status');
  statusEl.textContent = '⏳ 서버 연결 확인 중...';
  try {
    var res = await fetch('http://localhost:5000/status');
    var data = await res.json();
    if (!data.logged_in) { statusEl.textContent = '⚠️ 서버 로그인 중...'; return; }
  } catch(e) {
    statusEl.textContent = '❌ server.py가 실행되지 않았어요!';
    return;
  }
  var body = document.getElementById('mail-content').innerHTML;
  var subject = document.getElementById('mail-subject').textContent;
  var chargeId = m.type === '선취_MMS' ? 'mms-charge' : 'charge';
  var charge = document.getElementById(chargeId).value;
  if (!subject || !body) { showToast('금액을 먼저 입력해주세요!'); return; }
  statusEl.textContent = status === 'sent' ? '🚀 발송 중...' : '💾 임시저장 중...';
  try {
    var res2 = await fetch('http://localhost:5000/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({subject:subject, to:m.to, cc:m.cc||'', body:body, attachDir:m.attach?m.name:'', status:status, sender:m.sender||settings.defaultSender||''})
    });
    var data2 = await res2.json();
    if (data2.success) {
      recordHistory(m.name, status, charge);
      statusEl.textContent = status === 'sent' ? '✅ 발송 완료!' : '💾 임시저장 완료!';
    } else {
      statusEl.textContent = '❌ 오류: ' + data2.error;
    }
  } catch(e) {
    statusEl.textContent = '❌ 전송 실패. server.py 실행 중인지 확인해주세요.';
  }
}

function copyText(id) {
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(function() { showToast('📋 복사 완료!'); });
}
function copyEl(id) {
  var el = document.getElementById(id);
  var range = document.createRange();
  range.selectNode(el);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  document.execCommand('copy');
  window.getSelection().removeAllRanges();
  showToast('📋 본문 복사 완료!');
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

renderSelectList();
</script>
